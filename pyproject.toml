[project]
name = "krelcode"
version = "0.81.0"
description = "A coding agent built step by step — layered, decoupled, zero third-party runtime dependencies"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Arron" }]
keywords = ["agent", "coding-agent", "llm", "mcp", "cli"]
requires-python = ">=3.11"   # tomllib(3.11+) / zoneinfo / asyncio.to_thread
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
]
syntax = [
    "tree-sitter>=0.22",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
]

[project.scripts]
krelcode = "krelcode.entrypoints.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
krelcode = ["builtin_skills/**/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "src/krelcode/core",
    "src/krelcode/contracts",
    "src/krelcode/llm",
    "src/krelcode/safety",
    "src/krelcode/tools",
    "src/krelcode/mcp",
    "src/krelcode/plugins",
    "src/krelcode/skills",
    "src/krelcode/web",
    "src/krelcode/lsp",
    "src/krelcode/daemon",
    "src/krelcode/agent",
    "src/krelcode/session",
    "src/krelcode/subagent",
    "src/krelcode/bootstrap",
]

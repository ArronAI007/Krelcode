version = 1

# Existing intra-package cycles are frozen here. New cycles fail the architecture
# gate; remove entries as the corresponding modules are decoupled.
[[cycles]]
modules = [
  "benchmarks.acceptance",
  "benchmarks.behavior",
  "benchmarks.prompt",
  "benchmarks.report_store",
  "benchmarks.tuning",
]
reason = "Benchmark runners still share report/session helpers in both directions."

[file_size]
# New production files may not exceed this limit. Files already above it are
# capped at their current size and may only shrink.
max_unlisted_lines = 800


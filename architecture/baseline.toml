version = 1

# Benchmark domains are now acyclic. Any future intra-package cycle fails the
# architecture gate rather than being admitted into this baseline.
[dynamic_import]
# Dynamic loading bypasses static import analysis. Keep it visible and confined
# to process dispatch, optional adapters, plugin loading and benchmark facades.
allowed_files = [
  "benchmarks/behavior.py",
  "browser/runtime.py",
  "entrypoints/cli.py",
  "plugins/loader.py",
  "tools/symbols.py",
]

[file_size]
# New production files may not exceed this limit. Files already above it are
# capped at their current size and may only shrink.
max_unlisted_lines = 800

[file_size.limits]
"agent/context/compact_summary.py" = 859
"agent/context/compression.py" = 862
"agent/context/context_checkpoint.py" = 1037
"agent/prompt/fragments.py" = 880

version = 1

# Benchmark domains are now acyclic. Any future intra-package cycle fails the
# architecture gate rather than being admitted into this baseline.
[dynamic_import]
# Dynamic loading bypasses static import analysis. Keep it visible and confined
# to process dispatch, optional adapters and plugin loading.
allowed_files = [
  "browser/runtime.py",
  "entrypoints/cli.py",
  "plugins/loader.py",
  "tools/symbols.py",
]

[file_size]
# New production files may not exceed this limit. Files already above it are
# capped at their current size and may only shrink.
max_unlisted_lines = 800

[file_size.limits]
"agent/context/compact_summary.py" = 859
"agent/context/compression.py" = 886
"agent/prompt/fragments.py" = 880
"agent/prompt/prompt_authoring.py" = 890
"agent/prompt/prompt_plan.py" = 852
"agent/context/working_context.py" = 863
"browser/runtime.py" = 859
"enterprise/auth.py" = 847
"llm/base.py" = 816
"safety/sandbox_audit.py" = 899
"tools/builtin/database_migration.py" = 892
"ui/diff_review.py" = 919

[loop_dynamic_access]
limits = {}
